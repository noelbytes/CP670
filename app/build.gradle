plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.androidassignments'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.androidassignments"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig = true
    }
    androidResources {
        generateLocaleConfig false
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // Unit Testing - JUnit and Mockito (as recommended)
    testImplementation libs.junit
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation libs.mockito.inline

    // Robolectric for local Android unit tests
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'org.robolectric:robolectric:4.11.1'

    // Instrumented Testing - Espresso (as recommended)
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'

    // Awaitility for asynchronous testing
    testImplementation 'org.awaitility:awaitility:4.2.0'
}